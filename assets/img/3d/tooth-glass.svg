<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 0 192 220" width="192" height="220">
  <defs>
    <path id="shape" d="M100 30C86 16 64 10 46 14 24 19 14 40 16 66c2 26 14 44 18 68 4 26 6 62 28 70 20 7 22-26 28-38 4-8 16-8 20 0 6 12 8 45 28 38 22-8 24-44 28-70 4-24 16-42 18-68 2-26-8-47-30-52-18-4-40 2-54 16Z"/>
    <clipPath id="clip"><use href="#shape"/></clipPath>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#BFF3F4"/>
      <stop offset=".35" stop-color="#5FD3D6"/>
      <stop offset=".7" stop-color="#4C8FD8"/>
      <stop offset="1" stop-color="#3563B8"/>
    </linearGradient>
    <filter id="puff" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="13" result="b1"/>
      <feOffset in="b1" dx="-13" dy="-15" result="o1"/>
      <feComposite in="SourceAlpha" in2="o1" operator="out" result="r1"/>
      <feFlood flood-color="#1B3E86" flood-opacity=".55"/>
      <feComposite in2="r1" operator="in" result="shade"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="b3"/>
      <feOffset in="b3" dx="-3" dy="-4" result="o3"/>
      <feComposite in="SourceAlpha" in2="o3" operator="out" result="r3"/>
      <feFlood flood-color="#9DF2F0" flood-opacity=".8"/>
      <feComposite in2="r3" operator="in" result="bounce"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="b2"/>
      <feOffset in="b2" dx="4" dy="5" result="o2"/>
      <feComposite in="SourceAlpha" in2="o2" operator="out" result="r2"/>
      <feFlood flood-color="#FFFFFF" flood-opacity=".85"/>
      <feComposite in2="r2" operator="in" result="rim"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="shade"/>
        <feMergeNode in="bounce"/>
        <feMergeNode in="rim"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="mid" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.6"/></filter>
    <filter id="sharp" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.1"/></filter>
  </defs>
  <use href="#shape" fill="url(#base)" filter="url(#puff)"/>
  <g clip-path="url(#clip)">
    <ellipse cx="62" cy="52" rx="28" ry="15" fill="#fff" opacity=".85" filter="url(#soft)" transform="rotate(-35 62 52)"/>
    <ellipse cx="55" cy="47" rx="12" ry="5" fill="#fff" filter="url(#sharp)" transform="rotate(-35 55 47)"/>
    <ellipse cx="146" cy="40" rx="15" ry="7" fill="#fff" opacity=".6" filter="url(#mid)" transform="rotate(24 146 40)"/>
    <ellipse cx="46" cy="150" rx="4.5" ry="21" fill="#fff" opacity=".6" filter="url(#mid)" transform="rotate(-8 46 150)"/>
    <ellipse cx="120" cy="120" rx="30" ry="40" fill="#fff" opacity=".12" filter="url(#soft)"/>
  </g>
</svg>
