<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <path id="shape" d="M60 6c5 30 21 46 54 54-33 8-49 24-54 54-5-30-21-46-54-54 33-8 49-24 54-54Z"/>
    <clipPath id="clip"><use href="#shape"/></clipPath>
    <radialGradient id="base" cx=".38" cy=".32" r=".8">
      <stop offset="0" stop-color="#F8FFD9"/>
      <stop offset=".3" stop-color="#E2FA8C"/>
      <stop offset=".65" stop-color="#C3EC4C"/>
      <stop offset="1" stop-color="#8CBE17"/>
    </radialGradient>
    <filter id="puff" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="b1"/>
      <feOffset in="b1" dx="-6" dy="-7" result="o1"/>
      <feComposite in="SourceAlpha" in2="o1" operator="out" result="r1"/>
      <feFlood flood-color="#4E7F00" flood-opacity=".55"/>
      <feComposite in2="r1" operator="in" result="shade"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="b2"/>
      <feOffset in="b2" dx="2" dy="3" result="o2"/>
      <feComposite in="SourceAlpha" in2="o2" operator="out" result="r2"/>
      <feFlood flood-color="#FFFFFF" flood-opacity=".85"/>
      <feComposite in2="r2" operator="in" result="rim"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="shade"/><feMergeNode in="rim"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.6"/></filter>
    <filter id="sharp" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation=".8"/></filter>
  </defs>
  <use href="#shape" fill="url(#base)" filter="url(#puff)"/>
  <g clip-path="url(#clip)">
    <ellipse cx="50" cy="44" rx="10" ry="5" fill="#fff" opacity=".8" filter="url(#soft)" transform="rotate(-40 50 44)"/>
    <ellipse cx="55" cy="30" rx="2" ry="9" fill="#fff" filter="url(#sharp)" transform="rotate(8 55 30)"/>
    <ellipse cx="34" cy="58" rx="9" ry="2" fill="#fff" opacity=".75" filter="url(#sharp)"/>
  </g>
</svg>
