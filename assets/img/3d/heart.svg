<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 190" width="200" height="190">
  <defs>
    <path id="shape" d="M100 180C42 144 10 104 10 64 10 32 34 10 62 10c18 0 32 9 38 24 6-15 20-24 38-24 28 0 52 22 52 54 0 40-32 80-90 116Z"/>
    <clipPath id="clip"><use href="#shape"/></clipPath>
    <radialGradient id="base" cx=".32" cy=".26" r=".9">
      <stop offset="0" stop-color="#F8FFD9"/>
      <stop offset=".22" stop-color="#E4FA90"/>
      <stop offset=".55" stop-color="#C8F25C"/>
      <stop offset=".85" stop-color="#A3D52A"/>
      <stop offset="1" stop-color="#83B512"/>
    </radialGradient>
    <filter id="puff" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="b1"/>
      <feOffset in="b1" dx="-14" dy="-16" result="o1"/>
      <feComposite in="SourceAlpha" in2="o1" operator="out" result="r1"/>
      <feFlood flood-color="#4E7F00" flood-opacity=".6"/>
      <feComposite in2="r1" operator="in" result="shade"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="b3"/>
      <feOffset in="b3" dx="-3" dy="-4" result="o3"/>
      <feComposite in="SourceAlpha" in2="o3" operator="out" result="r3"/>
      <feFlood flood-color="#EFFFB8" flood-opacity=".75"/>
      <feComposite in2="r3" operator="in" result="bounce"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="b2"/>
      <feOffset in="b2" dx="4" dy="5" result="o2"/>
      <feComposite in="SourceAlpha" in2="o2" operator="out" result="r2"/>
      <feFlood flood-color="#FFFFFF" flood-opacity=".8"/>
      <feComposite in2="r2" operator="in" result="rim"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="shade"/><feMergeNode in="bounce"/><feMergeNode in="rim"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="mid" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.6"/></filter>
    <filter id="sharp" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.1"/></filter>
  </defs>
  <use href="#shape" fill="url(#base)" filter="url(#puff)"/>
  <g clip-path="url(#clip)">
    <ellipse cx="54" cy="46" rx="26" ry="14" fill="#fff" opacity=".78" filter="url(#soft)" transform="rotate(-30 54 46)"/>
    <ellipse cx="48" cy="42" rx="11" ry="5" fill="#fff" filter="url(#sharp)" transform="rotate(-30 48 42)"/>
    <ellipse cx="138" cy="34" rx="16" ry="6" fill="#fff" opacity=".55" filter="url(#mid)" transform="rotate(12 138 34)"/>
    <ellipse cx="40" cy="96" rx="4" ry="16" fill="#fff" opacity=".5" filter="url(#mid)" transform="rotate(-20 40 96)"/>
  </g>
</svg>
