  <path d="M36 78c0 84 168 84 168 0" fill="none" stroke="url(#base)" stroke-width="44" stroke-linecap="round" filter="url(#puff)"/>
  <path d="M28 86c4 50 46 70 92 72" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".7" filter="url(#soft)"/>
