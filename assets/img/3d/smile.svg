<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 190" width="240" height="190">
  <defs>
    <radialGradient id="base" cx=".3" cy=".25" r=".95">
      <stop offset="0" stop-color="#F6FFD3"/>
      <stop offset=".3" stop-color="#DDF883"/>
      <stop offset=".62" stop-color="#C3EC4C"/>
      <stop offset="1" stop-color="#86B812"/>
    </radialGradient>
    <radialGradient id="eye" cx=".36" cy=".3" r=".78">
      <stop offset="0" stop-color="#E4FFFC"/>
      <stop offset=".2" stop-color="#8DEBE2"/>
      <stop offset=".55" stop-color="#2EC4C7"/>
      <stop offset=".85" stop-color="#16939B"/>
      <stop offset="1" stop-color="#0E6F7A"/>
    </radialGradient>
    <filter id="puff" filterUnits="userSpaceOnUse" x="0" y="0" width="240" height="190" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="b1"/>
      <feOffset in="b1" dx="-8" dy="-11" result="o1"/>
      <feComposite in="SourceAlpha" in2="o1" operator="out" result="r1"/>
      <feFlood flood-color="#4E7F00" flood-opacity=".6"/>
