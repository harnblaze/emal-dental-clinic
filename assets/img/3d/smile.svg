    <ellipse cx="64" cy="21" rx="8" ry="4.5" fill="#fff" opacity=".9" filter="url(#sharp)" transform="rotate(-32 64 21)"/>
    <circle cx="168" cy="30" r="24" fill="url(#eye)"/>
